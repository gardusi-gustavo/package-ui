name: backup
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backup:
    uses: gardusi-gustavo/workflow-devops/.github/workflows/backup.yml@v0.1.0
    with:
      repository: gardusi-gustavo/package-ui
      retention: 3
    secrets: inherit
